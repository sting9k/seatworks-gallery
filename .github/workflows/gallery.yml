# Builds the gallery: the templates kept here beside the one that comes with Seatworks, and the page that lists them.
# On a pull request the build is the check a template passes to be published; on main the page is published.
name: Gallery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: The templates kept here
        uses: actions/checkout@v7
        with:
          path: gallery
          persist-credentials: false

      # The page and the gallery's build are Seatworks' own. SEATWORKS_REF is a variable of this repository.
      - name: Seatworks
        uses: actions/checkout@v7
        with:
          repository: sting9k/seatworks
          ref: ${{ vars.SEATWORKS_REF || 'main' }}
          path: seatworks
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: seatworks/package-lock.json

      - run: npm ci
        working-directory: seatworks

      # Fails, saying why, on a template that does not load or whose directory is not the name it installs under.
      - name: Build the gallery
        run: npm run gallery -- ../gallery/templates
        working-directory: seatworks

      - name: Build the page beside it
        run: npx vite build editor
        working-directory: seatworks

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: seatworks/editor/dist

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
